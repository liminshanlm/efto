<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>efto 颜色提取器</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      cursor: crosshair;
      user-select: none;
      -webkit-user-select: none;
    }
    #bg {
      position: absolute;
      left: 0;
      top: 0;
      pointer-events: none;
      image-rendering: auto;
    }
    #hline, #vline {
      position: fixed;
      background: #fff;
      mix-blend-mode: difference;
      pointer-events: none;
      display: none;
      z-index: 5;
    }
    #hline { left: 0; right: 0; height: 1px; }
    #vline { top: 0; bottom: 0; width: 1px; }
    #dot {
      position: fixed;
      width: 17px;
      height: 17px;
      border: 1px solid rgba(255, 255, 255, .95);
      outline: 1px solid rgba(0, 0, 0, .55);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      display: none;
      z-index: 6;
      box-sizing: border-box;
    }
    #magnifier {
      position: fixed;
      width: 148px;
      z-index: 8;
      padding: 8px;
      border-radius: 12px;
      background: rgba(20, 22, 30, .94);
      border: 1px solid rgba(255, 255, 255, .16);
      box-shadow: 0 12px 34px rgba(0, 0, 0, .5);
      pointer-events: none;
      display: none;
      box-sizing: border-box;
    }
    #zoom {
      display: block;
      width: 132px;
      height: 132px;
      border-radius: 6px;
      background: #000;
    }
    #hex {
      margin: 7px 0 2px;
      font: 600 15px/1.2 "Cascadia Mono", Consolas, monospace;
      color: #f5f6fa;
      letter-spacing: .04em;
    }
    #rgb {
      font: 11px/1.3 "Cascadia Mono", Consolas, monospace;
      color: rgba(220, 224, 235, .72);
    }
    #hint {
      position: fixed;
      left: 50%;
      top: 18px;
      transform: translateX(-50%);
      z-index: 9;
      padding: 7px 14px;
      border-radius: 999px;
      background: rgba(20, 22, 30, .86);
      color: #e9ecf4;
      font: 12px/1 "Segoe UI", "Microsoft YaHei", sans-serif;
      letter-spacing: .02em;
      pointer-events: none;
      white-space: nowrap;
    }
    #error {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      padding: 14px 20px;
      border-radius: 10px;
      background: rgba(28, 30, 38, .95);
      color: #ffb4b4;
      font: 13px/1.5 "Segoe UI", "Microsoft YaHei", sans-serif;
      display: none;
      z-index: 10;
    }
  </style>
</head>
<body>
  <img id="bg" alt="">
  <div id="hline"></div>
  <div id="vline"></div>
  <div id="dot"></div>
  <div id="magnifier">
    <canvas id="zoom" width="132" height="132"></canvas>
    <div id="hex">#000000</div>
    <div id="rgb">rgb(0, 0, 0)</div>
  </div>
  <div id="hint">移动光标取色 · 单击复制 HEX · Esc 取消</div>
  <div id="error"></div>
  <script src="color-picker.js"></script>
</body>
</html>
