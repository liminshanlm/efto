<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>efto 钉图</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        cursor: move;
        user-select: none;
      }
      #shot {
        display: block;
        width: 100%;
        height: 100%;
        transform-origin: 0 0;
        pointer-events: none;
      }
      #hint {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        color: #8d95a8;
        font: 13px "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei", sans-serif;
      }
    </style>
  </head>
  <body>
    <img id="shot" alt="" />
    <div id="hint">读取中…</div>
    <script src="pin.js"></script>
  </body>
</html>
