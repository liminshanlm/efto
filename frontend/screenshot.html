<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>efto 截图</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        /* 窗口是透明的：长图模式下藏掉 #bg 后要能看见并滚动底下的真实页面 */
        background: transparent;
        cursor: crosshair;
        user-select: none;
        font: 13px/1.4 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      }
      #bg {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: fill;
        pointer-events: none;
      }
      #mask {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        cursor: crosshair;
      }
      #bar {
        position: fixed;
        display: none;
        align-items: center;
        gap: 2px;
        padding: 5px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, .1);
        background: rgba(17, 19, 26, .9);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, .07),
          0 12px 32px rgba(0, 0, 0, .45);
        backdrop-filter: blur(18px) saturate(1.3);
        cursor: default;
        z-index: 3;
      }
      #bar button {
        border: 0;
        border-radius: 8px;
        padding: 7px 8px;
        color: #eef1f7;
        background: transparent;
        font: inherit;
        font-size: 12.5px;
        cursor: pointer;
        white-space: nowrap;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition: background .14s ease;
      }
      #bar button:hover { background: rgba(255, 255, 255, .1); }
      #bar button:disabled { opacity: .35; cursor: default; }
      #bar button:disabled:hover { background: transparent; }
      #bar button svg { width: 16px; height: 16px; display: block; }
      #bar button.active { background: rgba(120, 162, 255, .28); }
      #bar button.primary {
        background: #78a2ff;
        color: #10131a;
        font-weight: 600;
      }
      #bar button.primary:hover { background: #94b6ff; }
      #bar .sep {
        width: 1px;
        height: 18px;
        margin: 0 4px;
        background: rgba(255, 255, 255, .14);
      }
      #color-dot {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, .75);
        box-sizing: border-box;
        display: block;
      }
      #width-dot {
        background: #eef1f7;
        border-radius: 50%;
        display: block;
      }
      #palette {
        position: fixed;
        display: none;
        gap: 6px;
        padding: 8px;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, .1);
        background: rgba(17, 19, 26, .94);
        box-shadow: 0 12px 32px rgba(0, 0, 0, .45);
        z-index: 4;
      }
      #palette .swatch {
        width: 20px;
        height: 20px;
        border-radius: 6px;
        border: 1px solid rgba(255, 255, 255, .35);
        cursor: pointer;
        padding: 0;
      }
      #palette .swatch:hover { transform: scale(1.12); }
      #text-input {
        position: fixed;
        display: none;
        padding: 2px 4px;
        border: 1px dashed rgba(255, 255, 255, .65);
        border-radius: 4px;
        background: transparent;
        outline: none;
        resize: none;
        overflow: hidden;
        white-space: pre;
        z-index: 4;
        font: 14px/1.3 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      }
      #hint {
        position: fixed;
        left: 50%;
        top: 18px;
        transform: translateX(-50%);
        padding: 7px 15px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, .1);
        color: #eef1f7;
        background: rgba(17, 19, 26, .78);
        box-shadow: 0 6px 20px rgba(0, 0, 0, .3);
        backdrop-filter: blur(18px);
        pointer-events: none;
        z-index: 2;
      }
      #error {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%);
        padding: 9px 16px;
        border-radius: 10px;
        border: 1px solid rgba(255, 138, 128, .45);
        color: #ffe0dc;
        background: rgba(150, 40, 40, .94);
        box-shadow: 0 10px 30px rgba(0, 0, 0, .35);
        display: none;
        z-index: 4;
      }
    </style>
  </head>
  <body>
    <img id="bg" alt="" />
    <canvas id="mask"></canvas>
    <div id="hint">拖拽选择区域 · 工具栏标注 · 双击复制 · 右键/Esc 取消</div>
    <div id="bar">
      <button class="tool" data-tool="rect" title="矩形 (1)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="6" width="16" height="12" rx="1"/></svg>
      </button>
      <button class="tool" data-tool="ellipse" title="椭圆 (2)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="12" rx="8" ry="6"/></svg>
      </button>
      <button class="tool" data-tool="arrow" title="箭头 (3)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19 17 7M11 7h6v6"/></svg>
      </button>
      <button class="tool" data-tool="pen" title="画笔 (4)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1.4-4L17 4.4a2 2 0 012.8 0l-.2-.2a2 2 0 010 2.8L8 18.6 4 20z"/></svg>
      </button>
      <button class="tool" data-tool="marker" title="荧光笔 (5)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14l-4 4v3h3l4-4M9 14l10-10 4 4-10 10-4-4zM8 21h13"/></svg>
      </button>
      <button class="tool" data-tool="mosaic" title="马赛克 (6)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="4" y="4" width="7" height="7"/><rect x="13" y="4" width="7" height="7"/><rect x="4" y="13" width="7" height="7"/><rect x="13" y="13" width="7" height="7"/></svg>
      </button>
      <button class="tool" data-tool="text" title="文字 (7)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></svg>
      </button>
      <button class="tool" data-tool="eraser" title="橡皮 (8)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4l4.5 4.5a2 2 0 010 2.8L12 19.8H7.5L3.4 15.7a2 2 0 010-2.8L13 3.4a2 2 0 013 0zM10 21h11"/></svg>
      </button>
      <span class="sep"></span>
      <button id="btn-color" title="颜色"><span id="color-dot"></span></button>
      <button id="btn-width" title="粗细（点击切换）"><span id="width-dot"></span></button>
      <span class="sep"></span>
      <button id="btn-undo" title="撤销 (Ctrl+Z)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5 3 10l5 5M3 10h11a6 6 0 016 6v1"/></svg>
      </button>
      <button id="btn-redo" title="重做 (Ctrl+Y)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 5l5 5-5 5M21 10H10a6 6 0 00-6 6v1"/></svg>
      </button>
      <span class="sep"></span>
      <button id="btn-long" title="确认选区后在目标窗口滚动，停止滚动 2.5 秒后自动保存（不支持叠加标注）">长图</button>
      <button id="btn-cancel" title="取消 (Esc)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
      <button id="btn-pin" title="钉在屏幕">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6l-.8 7 2.8 3v2H7v-2l2.8-3L9 3zM12 15v6"/></svg>
      </button>
      <button id="btn-save" title="保存 (Ctrl+S)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h11l5 5v11a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2z"/><path d="M8 3v5h7V3M7 21v-7h10v7"/></svg>
      </button>
      <button id="btn-copy" class="primary" title="复制 (Enter / 双击)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
      </button>
    </div>
    <div id="palette"></div>
    <textarea id="text-input" spellcheck="false"></textarea>
    <div id="error"></div>
    <script src="screenshot.js"></script>
  </body>
</html>
