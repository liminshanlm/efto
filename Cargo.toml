[workspace]
resolver = "2"
members = ["crates/core", "crates/jsrt", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# ---- serialization / stdx ----
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2"
globset = "0.4"
parking_lot = "0.12"
crossbeam-channel = "0.5"
once_cell = "1"
dirs = "5"

# ---- internal ----
efto-core = { path = "crates/core" }
efto-jsrt = { path = "crates/jsrt" }

# ---- windows ----
winreg = "0.52"

# ---- matching ----
pinyin = "0.10"

# ---- time ----
# clock 已含 std/alloc + iana-time-zone；关掉 default 避开 oldtime/wasmbind。
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.dev]
opt-level = 1
debug = 0
incremental = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true
panic = "abort"
