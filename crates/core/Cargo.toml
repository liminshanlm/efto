[package]
name = "efto-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Application index, fuzzy search, plugin manifest and settings for the efto launcher (UI/runtime free, unit-testable)."

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
walkdir.workspace = true
globset.workspace = true
dirs.workspace = true
once_cell.workspace = true
pinyin.workspace = true
chrono.workspace = true
# 受限外部执行（es.exe）：摘要校验、zip 解包、下载。都已在依赖树里（tauri/png/ureq 带入）。
sha2 = "0.10"
flate2 = "1"
# macOS .app 的 Info.plist（XML/二进制都能读），纯 Rust 无 C 依赖
plist = "1"
ureq = { version = "2", default-features = false, features = ["native-tls", "json", "gzip"] }

# Win32_System_Console: GetConsoleOutputCP；Win32_Globalization: MultiByteToWideChar/GetACP
# （es.exe 输出 GBK，不是 UTF-8，必须按控制台代码页解码）
# Win32_UI_WindowsAndMessaging: ShellExecuteW（"打开方式"）
[target.'cfg(windows)'.dependencies]
winreg.workspace = true
windows-sys = { version = "0.59", features = ["Win32_System_Console", "Win32_Globalization", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }

[dev-dependencies]
tempfile = "3"
