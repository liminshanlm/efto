<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>局域网消息</title>
  <link rel="stylesheet" href="style.css" />
  <script>
    (function () {
      function applyTheme() {
        document.documentElement.dataset.theme = efto.isDarkMode() ? 'dark' : 'light';
      }
      try {
        applyTheme();
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
      try {
        var mq = window.matchMedia('(prefers-color-scheme: dark)');
        if (mq.addEventListener) mq.addEventListener('change', applyTheme);
        else if (mq.addListener) mq.addListener(applyTheme);
      } catch (e) { /* 没有 matchMedia 时只保留首帧主题 */ }
    })();
  </script>
</head>

<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>efto</span>
      </div>
      <span class="divider" aria-hidden="true"></span>
      <span class="plugin-name">局域网消息</span>
      <div class="top-actions">
        <span id="selfInfo" class="self-info" hidden></span>
        <span id="status" class="status" data-state="off"><i aria-hidden="true"></i><span id="statusText">未启动</span></span>
      </div>
    </header>

    <div id="error" class="banner" role="alert" hidden>
      <span id="errorText"></span>
      <button id="retryBtn" class="btn mini" type="button" hidden>重试启动</button>
    </div>

    <main class="main">
      <aside class="sidebar">
        <div class="side-head">
          <span>在线设备</span>
          <span id="peerCount" class="count">0</span>
        </div>
        <form id="probeForm" class="probe" autocomplete="off">
          <input id="probeIp" class="probe-input" type="text" inputmode="decimal" placeholder="按 IP 查询，如 192.168.1.20"
            spellcheck="false" />
          <button class="btn mini" type="submit">查询</button>
        </form>
        <p id="probeResult" class="probe-result" hidden></p>
        <div id="requests" class="requests" hidden></div>
        <ul id="peers" class="peers"></ul>
        <p id="emptyPeers" class="empty-hint">同网段打开本插件的设备会出现在这里…</p>
        <div class="side-foot"><span id="portInfo"></span></div>
      </aside>

      <section class="chat">
        <div id="chatEmpty" class="chat-empty">
          <div class="empty-glyph" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"
              stroke-linejoin="round">
              <path d="M4 6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H9l-4 4z" />
              <path d="M8 9h8" />
              <path d="M8 12h5" />
            </svg>
          </div>
          <p class="empty-title">从左侧选择一台设备开始聊天</p>
          <p class="empty-sub">首次发送消息需要对方同意接收；收到的文件保存在下载目录的 efto-ipmsg 下。仅与安装了 efto 的设备互通，不兼容飞鸽/IPMSG 客户端。</p>
        </div>

        <div id="chatPane" class="chat-pane" hidden>
          <div class="chat-head">
            <div class="peer-title">
              <span id="chatName"></span>
              <span id="chatAddr" class="peer-addr"></span>
            </div>
            <span id="chatBadge" class="badge"></span>
          </div>

          <div id="messages" class="messages"></div>

          <div class="composer">
            <div id="approval" class="approval" hidden>
              <span class="approval-text"><b id="approvalName"></b> 请求与你通信</span>
              <span class="approval-actions">
                <button id="approveBtn" class="btn primary" type="button">同意</button>
                <button id="denyBtn" class="btn danger" type="button">拒绝</button>
              </span>
            </div>
            <div id="composerHint" class="composer-hint" hidden></div>
            <div id="composerRow" class="composer-row">
              <textarea id="input" rows="2" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
              <button id="fileBtn" class="btn" type="button" title="发送文件">文件</button>
              <button id="sendBtn" class="btn primary" type="button">发送</button>
            </div>
          </div>
        </div>
      </section>
    </main>

    <div id="toast" class="toast" role="status" hidden></div>
  </div>

  <script src="ui.js"></script>
</body>

</html>
