<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Markdown</title>
  <link rel="stylesheet" href="style.css" />
  <script>
    (function () {
      function applyTheme() {
        document.documentElement.dataset.theme = efto.isDarkMode() ? 'dark' : 'light';
      }
      try {
        applyTheme();
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
      // 宿主切换主题时会改窗口的 prefers-color-scheme，跟着重画一次
      try {
        var mq = window.matchMedia('(prefers-color-scheme: dark)');
        if (mq.addEventListener) mq.addEventListener('change', applyTheme);
        else if (mq.addListener) mq.addListener(applyTheme);
      } catch (e) { /* 没有 matchMedia 时只保留首帧主题 */ }
    })();
  </script>
</head>

<body>
  <div class="app">
    <header class="topbar">
      <div class="doc-title">
        <span id="docName" class="doc-name">未命名.md</span>
        <span id="docDirty" class="doc-dirty" title="有未保存的修改" hidden></span>
      </div>

      <div id="modes" class="seg" role="tablist" aria-label="显示模式">
        <button class="seg-item on" data-mode="preview" type="button" role="tab">文档模式</button>
        <button class="seg-item" data-mode="split" type="button" role="tab">编辑模式</button>
        <button class="seg-item" data-mode="source" type="button" role="tab">源码模式</button>
      </div>

      <div class="top-actions">
        <button id="openBtn" class="icon-btn" type="button" title="打开文件 (Ctrl+O)" aria-label="打开文件">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h4l2 2h7A1.5 1.5 0 0 1 19 9.5v7A1.5 1.5 0 0 1 17.5 18h-13A1.5 1.5 0 0 1 3 16.5z" />
          </svg>
        </button>
        <button id="saveBtn" class="icon-btn" type="button" title="保存 (Ctrl+S)" aria-label="保存">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 4h9l3 3v13H6z" />
            <path d="M9 4v5h6V4M9 20v-5h6v5" />
          </svg>
        </button>
        <button id="exportBtn" class="icon-btn" type="button" title="导出 HTML" aria-label="导出 HTML">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 4v10m0 0 4-4m-4 4-4-4" />
            <path d="M5 16v3h14v-3" />
          </svg>
        </button>
        <button id="printBtn" class="icon-btn" type="button" title="打印 (Ctrl+P)" aria-label="打印">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7 9V4h10v5" />
            <path d="M6 17H4V9h16v8h-2" />
            <path d="M7 14h10v6H7z" />
          </svg>
        </button>
      </div>
    </header>

    <div id="toolbar" class="toolbar" hidden>
      <button type="button" data-act="h1">H1</button>
      <button type="button" data-act="h2">H2</button>
      <button type="button" data-act="h3">H3</button>
      <span class="toolbar-sep" aria-hidden="true"></span>
      <button type="button" data-act="bold">粗体</button>
      <button type="button" data-act="italic">斜体</button>
      <button type="button" data-act="strike">删除线</button>
      <button type="button" data-act="code">行内代码</button>
      <span class="toolbar-sep" aria-hidden="true"></span>
      <button type="button" data-act="ul">列表</button>
      <button type="button" data-act="ol">有序列表</button>
      <button type="button" data-act="task">任务</button>
      <button type="button" data-act="quote">引用</button>
      <span class="toolbar-sep" aria-hidden="true"></span>
      <button type="button" data-act="link">链接</button>
      <button type="button" data-act="image">图片</button>
      <button type="button" data-act="table">表格</button>
      <button type="button" data-act="codeblock">代码块</button>
      <button type="button" data-act="hr">分割线</button>
    </div>

    <main id="workspace" class="workspace" data-mode="preview">
      <div id="editorPane" class="editor-pane" hidden>
        <textarea id="editor" class="editor" spellcheck="false"
          placeholder="在这里写 Markdown，Ctrl+S 保存，Ctrl+E 切换模式"></textarea>
      </div>

      <div id="previewWrap" class="preview-wrap">
        <article id="preview" class="paper markdown-body"></article>

        <div id="empty" class="empty">
          <div class="empty-mark" aria-hidden="true">#</div>
          <p class="empty-title">还没有打开文档</p>
          <p class="empty-sub">打开一个 Markdown 文件，或新建空白文档后开始写。也可以把文件拖进这个窗口。</p>
          <div class="empty-actions">
            <button id="emptyOpen" class="btn primary" type="button">打开文件</button>
            <button id="emptyNew" class="btn" type="button">新建文档</button>
          </div>
        </div>
      </div>

      <div id="dropMask" class="drop-mask" hidden>
        <div class="drop-box">松开打开 Markdown 文件</div>
      </div>
    </main>

    <footer class="foot">
      <span id="status" class="status">就绪</span>
      <span id="meta" class="meta"></span>
      <span id="pathInfo" class="path">未保存</span>
      <span class="keys">Ctrl+S 保存 · Ctrl+O 打开 · Ctrl+E 切换模式</span>
    </footer>

    <div id="toast" class="toast" role="status" hidden></div>
  </div>

  <script src="render.js"></script>
  <script src="ui.js"></script>
</body>

</html>
