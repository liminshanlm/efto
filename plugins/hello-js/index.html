<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>hello-js</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #121419;
        --side: #16191f;
        --card: #1b1e26;
        --text: #eef1f7;
        --text-2: #b4bac8;
        --text-3: #8d95a8;
        --border: rgba(255, 255, 255, 0.08);
        --border-strong: rgba(255, 255, 255, 0.16);
        --hover: #232733;
        --accent: #78a2ff;
        --accent-hover: #94b6ff;
        --accent-soft: rgba(120, 162, 255, 0.14);
        --accent-line: rgba(120, 162, 255, 0.4);
        --code: #12151a;
        --radius: 14px;
      }
      html[data-theme="light"] {
        color-scheme: light;
        --bg: #f4f6fa;
        --side: #eef1f7;
        --card: #ffffff;
        --text: #1a1e28;
        --text-2: #3f4657;
        --text-3: #6b7385;
        --border: rgba(15, 23, 42, 0.1);
        --border-strong: rgba(15, 23, 42, 0.18);
        --hover: #e8ecf4;
        --accent: #3b6fe0;
        --accent-hover: #2f5fcc;
        --accent-soft: rgba(59, 111, 224, 0.1);
        --accent-line: rgba(59, 111, 224, 0.34);
        --code: #f1f4fa;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background:
          radial-gradient(120% 90% at 0% 0%, rgba(120, 162, 255, 0.08), transparent 55%),
          var(--bg);
        color: var(--text);
        font: 13px/1.6 "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI",
          "Microsoft YaHei", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        user-select: none;
      }
      ::selection { background: var(--accent-soft); }

      .app { display: flex; flex-direction: column; height: 100%; }

      .topbar {
        display: flex;
        align-items: center;
        gap: 10px;
        height: 52px;
        flex: 0 0 52px;
        padding: 0 18px;
        border-bottom: 1px solid var(--border);
        background: var(--side);
      }
      .brand { display: flex; align-items: center; gap: 9px; font-size: 14px; font-weight: 650; }
      .brand-mark {
        width: 19px;
        height: 19px;
        border-radius: 6px;
        background: linear-gradient(150deg, #9ec0ff 0%, #5b87f0 52%, #3a5fd0 100%);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.45), 0 2px 8px rgba(79, 124, 245, 0.28);
      }
      .divider { width: 1px; height: 16px; background: var(--border-strong); }
      .plugin-name { color: var(--text-2); font-weight: 550; }
      .tag {
        margin-left: auto;
        padding: 3px 10px;
        border-radius: 999px;
        background: var(--accent-soft);
        color: var(--accent);
        font-size: 11.5px;
      }

      .main { flex: 1; overflow-y: auto; padding: 26px 28px 30px; }
      .page { max-width: 720px; margin: 0 auto; }

      h1 { margin: 0 0 4px; font-size: 21px; font-weight: 650; letter-spacing: -0.01em; }
      .sub { margin: 0 0 22px; color: var(--text-3); font-size: 12.5px; }
      .sub code {
        font-family: "Cascadia Mono", Consolas, monospace;
        padding: 1px 5px;
        border-radius: 5px;
        background: var(--hover);
        color: var(--text-2);
      }

      .hero {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 18px 20px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--card);
      }
      .hero-label { color: var(--text-3); font-size: 11.5px; margin-bottom: 4px; }
      .hero-text {
        font-size: 20px;
        font-weight: 650;
        letter-spacing: -0.01em;
        color: var(--text);
        word-break: break-word;
      }
      .hero-glyph {
        margin-left: auto;
        width: 44px;
        height: 44px;
        flex: 0 0 44px;
        display: grid;
        place-items: center;
        border-radius: 12px;
        background: var(--accent-soft);
        color: var(--accent);
        font-size: 19px;
        font-weight: 650;
      }

      .metrics {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-top: 12px;
      }
      .metric {
        padding: 14px 16px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--card);
      }
      .metric .k { color: var(--text-3); font-size: 11.5px; margin-bottom: 6px; }
      .metric .v {
        font-family: "Cascadia Mono", Consolas, monospace;
        font-size: 14px;
        font-weight: 600;
        word-break: break-all;
      }

      .actions { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
      .btn {
        appearance: none;
        border: 1px solid var(--border-strong);
        background: var(--card);
        color: var(--text);
        border-radius: 9px;
        padding: 7px 15px;
        font: inherit;
        font-size: 12.5px;
        cursor: pointer;
        transition: background 0.14s ease, border-color 0.14s ease, color 0.14s ease;
      }
      .btn:hover { background: var(--hover); }
      .btn:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--accent-soft); border-color: var(--accent); }
      .btn.primary {
        background: var(--accent);
        border-color: transparent;
        color: #fff;
        font-weight: 550;
      }
      .btn.primary:hover { background: var(--accent-hover); }

      .log-card {
        margin-top: 22px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--card);
        overflow: hidden;
      }
      .log-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 16px;
        border-bottom: 1px solid var(--border);
        color: var(--text-3);
        font-size: 11.5px;
      }
      .log-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
      .log-head span:first-child { display: flex; align-items: center; gap: 8px; }
      pre {
        margin: 0;
        padding: 14px 16px;
        min-height: 120px;
        max-height: 240px;
        overflow: auto;
        background: var(--code);
        color: var(--text-2);
        font: 12px/1.7 "Cascadia Mono", Consolas, monospace;
        user-select: text;
        white-space: pre-wrap;
        word-break: break-word;
      }
      pre::-webkit-scrollbar { width: 10px; height: 10px; }
      pre::-webkit-scrollbar-thumb {
        border: 3px solid transparent;
        border-radius: 999px;
        background: var(--border-strong);
        background-clip: content-box;
      }

      @media (max-width: 560px) {
        .metrics { grid-template-columns: 1fr; }
        .main { padding: 20px; }
      }
      @media (prefers-reduced-motion: reduce) {
        * { transition: none !important; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <span>efto</span>
        </div>
        <span class="divider" aria-hidden="true"></span>
        <span class="plugin-name">hello-js</span>
        <span class="tag">示例插件</span>
      </header>

      <main class="main">
        <div class="page">
          <h1>打招呼</h1>
          <p class="sub">
            这个页面由 <code>efto://</code> 协议从插件目录直接加载，SDK 由宿主注入。
          </p>

          <section class="hero" aria-label="打招呼内容">
            <div>
              <div class="hero-label">打招呼内容</div>
              <div class="hero-text" id="text">—</div>
            </div>
            <div class="hero-glyph" aria-hidden="true">Hi</div>
          </section>

          <div class="metrics">
            <div class="metric">
              <div class="k">累计次数</div>
              <div class="v" id="count">—</div>
            </div>
            <div class="metric">
              <div class="k">本次进程</div>
              <div class="v" id="launches">—</div>
            </div>
            <div class="metric">
              <div class="k">语言 / 文档数</div>
              <div class="v" id="meta">—</div>
            </div>
          </div>

          <div class="actions">
            <button type="button" id="copy" class="btn primary">复制打招呼内容</button>
            <button type="button" id="whoami" class="btn">查询运行环境</button>
            <button type="button" id="reset" class="btn">清空数据</button>
          </div>

          <section class="log-card" aria-label="消息日志">
            <div class="log-head">
              <span><i class="log-dot" aria-hidden="true"></i>消息</span>
              <span>main → UI</span>
            </div>
            <pre id="log">等待 main 的消息…</pre>
          </section>
        </div>
      </main>
    </div>

    <script>
      (function () {
        function applyTheme() {
          document.documentElement.dataset.theme = efto.isDarkMode() ? 'dark' : 'light';
        }
        try {
          applyTheme();
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
        // 宿主切换主题时会改窗口的 prefers-color-scheme，跟着重画一次
        try {
          var mq = window.matchMedia('(prefers-color-scheme: dark)');
          if (mq.addEventListener) mq.addEventListener('change', applyTheme);
          else if (mq.addListener) mq.addListener(applyTheme);
        } catch (e) { /* 没有 matchMedia 时只保留首帧主题 */ }
      })();
      var log = document.getElementById('log');
      function write(x) {
        log.textContent = typeof x === 'string' ? x : JSON.stringify(x, null, 2);
      }

      // 由宿主注入的 SDK：window.efto
      efto.onMessage('greet', function (d) {
        document.getElementById('text').textContent = d.text;
        document.getElementById('count').textContent = d.count;
        document.getElementById('launches').textContent = d.launches;
        document.getElementById('meta').textContent = d.locale + ' / ' + d.docs;
        write({ 收到: 'greet', 数据: d });
      });
      efto.onMessage('copied', function (d) { write({ 收到: 'copied', 数据: d }); });
      efto.onMessage('reset-done', function (d) {
        ['text', 'count', 'launches', 'meta'].forEach(function (id) {
          document.getElementById(id).textContent = '—';
        });
        write({ 收到: 'reset-done', 数据: d });
      });
      efto.onMessage('whoami', function (d) { write({ 运行环境: d }); });

      document.getElementById('copy').onclick = function () {
        efto.ipcMessage('copy-greet', { text: document.getElementById('text').textContent });
      };
      document.getElementById('whoami').onclick = function () {
        efto.ipcMessage('whoami', {});
      };
      document.getElementById('reset').onclick = function () {
        efto.ipcMessage('reset', {});
      };
    </script>
  </body>
</html>
