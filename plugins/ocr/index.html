<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OCR 文字识别</title>
  <link rel="stylesheet" href="style.css" />
  <script>
    (function () {
      function applyTheme() {
        document.documentElement.dataset.theme = efto.isDarkMode() ? 'dark' : 'light';
      }
      try {
        applyTheme();
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
      // 宿主切换主题时会改窗口的 prefers-color-scheme，跟着重画一次
      try {
        var mq = window.matchMedia('(prefers-color-scheme: dark)');
        if (mq.addEventListener) mq.addEventListener('change', applyTheme);
        else if (mq.addListener) mq.addListener(applyTheme);
      } catch (e) { /* 没有 matchMedia 时只保留首帧主题 */ }
    })();
  </script>
</head>

<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>efto</span>
      </div>
      <span class="divider" aria-hidden="true"></span>
      <span class="plugin-name">OCR 文字识别</span>
      <span class="model" id="model"></span>
      <div class="tabs" id="tabs" role="tablist" aria-label="识别模式">
        <button type="button" data-mode="text" class="on" role="tab" aria-selected="true">文字</button>
        <button type="button" data-mode="table" role="tab" aria-selected="false">表格</button>
        <button type="button" data-mode="formula" role="tab" aria-selected="false">公式</button>
      </div>
    </header>

    <main class="layout">
      <aside class="pane source" aria-label="图片">
        <div class="pane-head">
          <span>图片</span>
          <span class="pane-note">png / jpg / webp / bmp</span>
        </div>

        <div id="drop" class="drop" role="button" tabindex="0" aria-label="选择图片">
          <div class="drop-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
              stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="16" rx="2" />
              <circle cx="8.5" cy="9.5" r="1.5" />
              <path d="m21 15-5-5L5 20" />
            </svg>
          </div>
          <div class="drop-text"><b>点击选图</b> 或拖到这里</div>
          <div class="drop-sub">支持 Ctrl+V 粘贴剪贴板图片</div>
        </div>

        <div class="preview" id="preview"></div>
        <div class="thumbs" id="thumbs"></div>

        <div class="source-foot">
          <button class="btn" id="btnPaste" type="button" title="读取剪贴板里的图片（Ctrl+V）">粘贴图片</button>
          <button class="btn ghost" id="btnReset" type="button" title="清空结果与已选图片">清空</button>
        </div>
      </aside>

      <section class="pane result" aria-label="识别结果">
        <div class="result-bar">
          <span class="stat" id="stat">等待选择图片</span>
          <div class="result-actions">
            <button class="btn" id="btnRetry" type="button" disabled>重新识别</button>
            <button class="btn primary" id="btnCopy" type="button" disabled>复制</button>
            <button class="btn" id="btnSave" type="button" disabled>保存</button>
          </div>
        </div>
        <textarea id="out" spellcheck="false" placeholder="识别结果会出现在这里…"
          aria-label="识别结果"></textarea>
      </section>
    </main>
  </div>

  <script>
    (function () {
      'use strict';

      var state = { busy: false, modelName: '', file: '', preview: '', mode: 'text', status: '', error: '', result: '' };
      var picked = [];
      var activePath = '';

      var $ = function (id) { return document.getElementById(id); };
      var drop = $('drop'), previewEl = $('preview'), thumbs = $('thumbs'), stat = $('stat'), out = $('out'), model = $('model');
      var previewUrl = '';

      function setStat(text, kind) {
        stat.textContent = text;
        stat.className = 'stat' + (kind ? ' ' + kind : '');
      }

      // 左栏图片预览：只在 URL 变化时重建 <img>，避免每次 state 推送都重绘。
      function renderPreview() {
        var url = activePath && state.preview ? state.preview : '';
        if (url === previewUrl) return;
        previewUrl = url;
        previewEl.innerHTML = '';
        if (!url) return;
        var img = document.createElement('img');
        img.src = url;
        img.alt = '图片预览';
        previewEl.appendChild(img);
      }

      function render() {
        model.textContent = state.modelName ? '模型 · ' + state.modelName : '';
        model.title = state.modelName || '';
        renderPreview();

        if (state.busy) setStat(state.status || '正在识别…');
        else if (state.error) setStat(state.error, 'err');
        else if (state.status) setStat(state.status, 'ok');
        else if (activePath) setStat('已选：' + activePath.split(/[\\/]/).pop());
        else setStat('等待选择图片 · 使用 设置 → 模型 里的默认模型');

        if (typeof state.result === 'string' && out.value !== state.result) out.value = state.result;

        var has = !!out.value;
        $('btnCopy').disabled = !has;
        $('btnSave').disabled = !has;
        $('btnRetry').disabled = !activePath || state.busy;
      }

      function setMode(mode) {
        state.mode = mode;
        var btns = $('tabs').querySelectorAll('button');
        for (var i = 0; i < btns.length; i++) {
          var on = btns[i].getAttribute('data-mode') === mode;
          btns[i].classList.toggle('on', on);
          btns[i].setAttribute('aria-selected', on ? 'true' : 'false');
        }
      }

      function addPaths(paths) {
        for (var i = 0; i < paths.length; i++) {
          var p = paths[i];
          if (!p || picked.indexOf(p) >= 0) continue;
          if (!/\.(png|jpe?g|webp|gif|bmp)$/i.test(p)) continue;
          picked.push(p);
        }
        renderThumbs();
        if (picked.length && !activePath) useImage(picked[0]);
      }

      function renderThumbs() {
        thumbs.innerHTML = '';
        picked.forEach(function (p) {
          var d = document.createElement('div');
          d.className = 'thumb' + (p === activePath ? ' on' : '');
          d.setAttribute('role', 'button');
          d.tabIndex = 0;

          var icon = document.createElement('span');
          icon.className = 'thumb-icon';
          icon.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="m21 15-5-5L5 20"/></svg>';
          d.appendChild(icon);

          var box = document.createElement('span');
          box.className = 'thumb-text';
          var name = document.createElement('b');
          name.className = 'thumb-name';
          name.textContent = p.split(/[\\/]/).pop();
          var full = document.createElement('span');
          full.className = 'thumb-path';
          full.textContent = p;
          box.appendChild(name);
          box.appendChild(full);
          d.appendChild(box);

          d.title = p;
          d.addEventListener('click', function () { useImage(p); });
          d.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              useImage(p);
            }
          });
          thumbs.appendChild(d);
        });
      }

      function useImage(p) {
        if (state.file !== p) state.preview = '';
        activePath = p;
        renderThumbs();
        efto.ipcMessage('pick-image', { path: p, mode: state.mode });
        render();
      }

      function pickImage() {
        efto.pickFiles().then(function (paths) {
          if (!paths || !paths.length) return;
          addPaths(paths);
        });
      }

      drop.addEventListener('click', pickImage);
      drop.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          pickImage();
        }
      });

      efto.onFileDrag(function (inside) { drop.classList.toggle('hot', !!inside); });
      efto.onFileDrop(function (paths) {
        drop.classList.remove('hot');
        addPaths(paths || []);
      });

      // Ctrl+V：只在剪贴板里确实是图片时拦截，否则保留文本框的正常粘贴。
      document.addEventListener('paste', function (e) {
        var items = (e.clipboardData && e.clipboardData.items) || [];
        var hasImage = false;
        for (var k = 0; k < items.length; k++) {
          if (items[k].type && items[k].type.indexOf('image/') === 0) { hasImage = true; break; }
        }
        if (!hasImage) return;
        e.preventDefault();
        efto.ipcMessage('paste-image', {});
      });

      $('btnPaste').addEventListener('click', function () {
        efto.ipcMessage('paste-image', {});
      });

      var tabEls = $('tabs').querySelectorAll('button');
      for (var i = 0; i < tabEls.length; i++) {
        tabEls[i].addEventListener('click', function (e) {
          setMode(e.currentTarget.getAttribute('data-mode'));
          if (activePath && !state.busy) efto.ipcMessage('pick-image', { path: activePath, mode: state.mode });
        });
      }

      $('btnRetry').addEventListener('click', function () {
        if (activePath) efto.ipcMessage('retry', {});
      });

      $('btnCopy').addEventListener('click', function () {
        if (out.value) efto.ipcMessage('copy', { text: out.value });
      });

      $('btnSave').addEventListener('click', function () {
        if (out.value) efto.ipcMessage('save-result', { text: out.value });
      });

      $('btnReset').addEventListener('click', function () {
        picked = [];
        activePath = '';
        out.value = '';
        state.result = '';
        state.preview = '';
        state.error = '';
        state.status = '';
        renderThumbs();
        render();
      });

      efto.onMessage('state', function (s) {
        if (!s) return;
        state = s;
        if (s.mode) setMode(s.mode);
        if (typeof s.file === 'string' && s.file && picked.indexOf(s.file) < 0) {
          picked.push(s.file);
          renderThumbs();
        }
        if (typeof s.file === 'string' && s.file) activePath = s.file;
        render();
      });

      efto.ipcMessage('init', {});
      render();
    })();
  </script>
</body>

</html>
