<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>网页快开</title>
  <link rel="stylesheet" href="ui/app.css" />
  <script>
    (function () {
      function applyTheme() {
        document.documentElement.dataset.theme = efto.isDarkMode() ? 'dark' : 'light';
      }
      try {
        applyTheme();
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
      // 宿主切换主题时会改窗口的 prefers-color-scheme，跟着重画一次
      try {
        var mq = window.matchMedia('(prefers-color-scheme: dark)');
        if (mq.addEventListener) mq.addEventListener('change', applyTheme);
        else if (mq.addListener) mq.addListener(applyTheme);
      } catch (e) { /* 没有 matchMedia 时只保留首帧主题 */ }
    })();
  </script>
</head>

<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>efto</span>
      </div>
      <span class="divider" aria-hidden="true"></span>
      <span class="plugin-name">网页快开</span>

      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
          aria-hidden="true">
          <circle cx="11" cy="11" r="7" />
          <path d="m20 20-3.2-3.2" />
        </svg>
        <input id="filter" type="text" placeholder="筛选触发词或网址" autocomplete="off" spellcheck="false"
          aria-label="筛选触发词或网址" />
      </label>

      <button id="refresh" class="btn" type="button" title="重新读取站点列表">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
          stroke-linejoin="round" aria-hidden="true">
          <path d="M20 11a8 8 0 1 0-2.3 5.7" />
          <path d="M20 4v7h-7" />
        </svg>
        刷新
      </button>
    </header>

    <nav id="tabs" class="tabs" role="tablist" aria-label="站点分组"></nav>

    <main class="main">
      <div id="list" class="content"></div>
    </main>

    <div id="toast" class="toast" role="status" hidden></div>
  </div>

  <script src="./ui/app.js"></script>
</body>

</html>
