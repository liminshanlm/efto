<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI 对话</title>
  <link rel="stylesheet" href="style.css" />
  <script>
    (function () {
      function applyTheme() {
        document.documentElement.dataset.theme = efto.isDarkMode() ? 'dark' : 'light';
      }
      try {
        applyTheme();
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
      // 宿主切换主题时会改窗口的 prefers-color-scheme，跟着重画一次
      try {
        var mq = window.matchMedia('(prefers-color-scheme: dark)');
        if (mq.addEventListener) mq.addEventListener('change', applyTheme);
        else if (mq.addListener) mq.addListener(applyTheme);
      } catch (e) { /* 没有 matchMedia 时只保留首帧主题 */ }
    })();
  </script>
</head>

<body>
  <div class="app">
    <aside class="sidebar">
      <div class="side-brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">efto</span>
        <span class="side-tag">AI</span>
      </div>

      <div class="side-head">
        <button id="new-chat" class="new-btn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
            aria-hidden="true">
            <path d="M12 5v14M5 12h14" />
          </svg>
          新对话
        </button>
      </div>

      <nav id="conversations" class="conversations" aria-label="会话列表"></nav>

      <div class="side-foot">
        <span id="count" class="muted"></span>
        <button id="clear-all" class="link-btn" type="button">清空</button>
      </div>
    </aside>

    <main class="chat">
      <header class="chat-head">
        <div class="title-block">
          <h1 id="chat-title">新对话</h1>
          <span id="chat-sub" class="muted"></span>
        </div>
        <label class="model-pick">
          <span class="muted">模型</span>
          <select id="model" aria-label="选择模型"></select>
        </label>
      </header>

      <section id="messages" class="messages" aria-live="polite"></section>

      <div id="empty" class="empty">
        <div class="empty-logo" aria-hidden="true">AI</div>
        <h2>问点什么？</h2>
        <p>使用 <b>设置 → 模型</b> 里配置的模型。支持图片、文档 OCR、联网搜索与多会话。</p>
        <div class="empty-tips">
          <span><kbd>Enter</kbd> 发送</span>
          <span><kbd>Shift</kbd> + <kbd>Enter</kbd> 换行</span>
          <span><kbd>Ctrl</kbd> + <kbd>V</kbd> 粘贴图片</span>
          <span>拖入文档自动识别</span>
        </div>
      </div>

      <div class="composer">
        <div id="attachments" class="attachments" hidden></div>
        <div id="docs" class="docs" hidden></div>
        <div id="hint" class="hint" role="status" hidden></div>
        <textarea id="input" rows="1" placeholder="输入问题，Enter 发送…" spellcheck="false"
          aria-label="输入问题"></textarea>
        <div class="composer-bar">
          <div class="left">
            <button id="pick" class="ghost" type="button" title="选择图片">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
                stroke-linejoin="round" aria-hidden="true">
                <rect x="3" y="4" width="18" height="16" rx="2" />
                <circle cx="8.5" cy="9.5" r="1.5" />
                <path d="m21 15-5-5L5 20" />
              </svg>
              图片
            </button>
            <button id="pick-file" class="ghost" type="button" title="识别 PDF / Word / PPT / 图片中的文字">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
                stroke-linejoin="round" aria-hidden="true">
                <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z" />
                <path d="M14 3v5h5" />
              </svg>
              文档
            </button>
            <button id="web" class="ghost toggle" type="button"
              title="联网搜索与网页读取（DeepSeek 服务端完成，需 deepseek-flash）" aria-pressed="false">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
                stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="9" />
                <path d="M3 12h18" />
                <path d="M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18" />
              </svg>
              联网
            </button>
            <span id="model-state" class="muted small"></span>
          </div>
          <button id="send" class="primary" type="button">发送</button>
        </div>
      </div>
    </main>
  </div>

  <script src="ui.js"></script>
</body>

</html>
