# 发布工作流：打 v* tag（或手动触发）时构建 Windows / Apple Silicon 产物并挂到 GitHub Release。
#
# 产物：
#   efto-<ver>-windows-x64-portable.zip   绿色版：efto.exe + plugins/（解压即用）
#   efto_<ver>_x64-setup.exe              NSIS 安装包（插件随包内置）
#   efto-<ver>-macos-arm64.dmg            macOS Apple Silicon 磁盘映像（ad-hoc 签名，未公证）
#   <plugin>-<version>.zip                单个插件包，可在设置页导入或解压到 ~/.efto/plugins
#
# 为什么不用 scripts/bootstrap.ps1 / scripts/cargo.ps1：
#   这两个脚本假设本机有 C:\BuildTools-MSVC 且允许 UAC 安装 VS。GitHub runner 上
#   不成立（runner 自带 rust 与 MSVC，rustc 自己找得到 link.exe），所以这里直接
#   调 cargo / tauri CLI。
#
# V8 预编译静态库不入库：按 runner 架构从 denoland/rusty_v8 下载，并校验 sha256
# （Windows 取 .cargo/config.toml，macOS 取 scripts/cargo.sh 里钉的值），避免漂移。
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch rusty_v8 prebuilt
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path vendor/rusty_v8 | Out-Null
          $file = 'rusty_v8_release_x86_64-pc-windows-msvc.lib.gz'
          $dest = Join-Path 'vendor/rusty_v8' $file
          $url = "https://github.com/denoland/rusty_v8/releases/download/v152.2.0/$file"
          curl.exe -fsSL -o $dest $url
          if ($LASTEXITCODE -ne 0) { throw "download failed: $url" }
          $m = Select-String -Path .cargo/config.toml -Pattern 'RUSTY_V8_ARCHIVE_SHA256\s*=\s*"([0-9a-f]{64})"'
          if (-not $m) { throw 'RUSTY_V8_ARCHIVE_SHA256 not found in .cargo/config.toml' }
          $expected = $m.Matches[0].Groups[1].Value
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $dest).Hash.ToLower()
          if ($actual -ne $expected) { throw "sha256 mismatch: got $actual, want $expected" }
          Write-Host "rusty_v8 ok ($expected)"

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $cfg = Get-Content crates/app/tauri.conf.json -Raw | ConvertFrom-Json
          "v=$($cfg.version)" >> $env:GITHUB_OUTPUT

      # 一次 tauri build 同时产出 exe 与 NSIS 安装包；绿色版直接复用这份 exe。
      - name: Build exe + NSIS installer
        shell: pwsh
        working-directory: crates/app
        run: npx -y "@tauri-apps/cli@2" build --bundles nsis

      - name: Package portable zip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $v = '${{ steps.ver.outputs.v }}'
          $stage = "dist/efto-$v"
          New-Item -ItemType Directory -Force -Path "$stage/plugins" | Out-Null
          $exe = @('target/release/efto.exe', 'crates/app/target/release/efto.exe') |
            Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $exe) { throw 'efto.exe not found under target/release' }
          Copy-Item -LiteralPath $exe -Destination $stage
          Copy-Item -Path 'plugins/*' -Destination "$stage/plugins" -Recurse -Force
          Copy-Item -LiteralPath 'LICENSE' -Destination $stage
          if (Test-Path 'THIRD_PARTY_LICENSES.md') {
            Copy-Item -LiteralPath 'THIRD_PARTY_LICENSES.md' -Destination $stage
          }
          if (Test-Path 'licenses') {
            Copy-Item -LiteralPath 'licenses' -Destination $stage -Recurse -Force
          }
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/efto-$v-windows-x64-portable.zip"

      - name: Package plugin zips
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/package-plugins.ps1 -OutDir dist/plugins

      - name: Collect installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Get-ChildItem -Path 'target/release/bundle/nsis/*.exe', 'crates/app/target/release/bundle/nsis/*.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $setup) { throw 'NSIS installer not found under target/release/bundle/nsis' }
          Copy-Item -LiteralPath $setup.FullName -Destination 'dist'
          Get-ChildItem -Path 'dist' -Recurse -File | ForEach-Object {
            Write-Host ("{0}  {1:N1} MB" -f $_.FullName, ($_.Length / 1MB))
          }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist

  macos-arm64:
    # macos-15 是 Apple Silicon（arm64, M1）runner；macos-14 已被 GitHub 下线。
    # Intel 版后续可用 macos-15-intel + 交叉编译 aarch64，或另加 x64 job。
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Verify Apple Silicon runner
        shell: bash
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          echo "arch=$arch"
          [ "$arch" = "arm64" ] || { echo "expected arm64 runner, got $arch" >&2; exit 1; }

      - name: Fetch rusty_v8 prebuilt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vendor/rusty_v8
          file=librusty_v8_release_aarch64-apple-darwin.a.gz
          dest="vendor/rusty_v8/$file"
          curl -fsSL -o "$dest" "https://github.com/denoland/rusty_v8/releases/download/v152.2.0/$file"
          # 与 scripts/cargo.sh 里 aarch64-apple-darwin 的钉值保持一致
          expected=a4a5484444ad4b5f10dc7bed141236dd9dbeabf2006d14520f19b935d4db4227
          actual="$(shasum -a 256 "$dest" | awk '{print $1}')"
          if [ "$actual" != "$expected" ]; then
            echo "sha256 mismatch: got $actual, want $expected" >&2
            exit 1
          fi
          echo "rusty_v8 ok ($expected)"

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          v="$(python3 -c 'import json;print(json.load(open("crates/app/tauri.conf.json"))["version"])')"
          echo "v=$v" >> "$GITHUB_OUTPUT"

      # ad-hoc 签名：arm64 上二进制至少要有一个有效签名，未公证仍会被 Gatekeeper 拦。
      - name: Build dmg
        working-directory: crates/app
        env:
          RUSTY_V8_ARCHIVE: ${{ github.workspace }}/vendor/rusty_v8/librusty_v8_release_aarch64-apple-darwin.a.gz
          RUSTY_V8_ARCHIVE_SHA256: a4a5484444ad4b5f10dc7bed141236dd9dbeabf2006d14520f19b935d4db4227
          APPLE_SIGNING_IDENTITY: "-"
        run: npx -y "@tauri-apps/cli@2" build --bundles app,dmg

      - name: Package dmg
        shell: bash
        run: |
          set -euo pipefail
          v='${{ steps.ver.outputs.v }}'
          dmg="$(find . -type f -path '*/release/bundle/dmg/*.dmg' | head -n 1)"
          if [ -z "$dmg" ]; then echo "dmg not found under target/release/bundle/dmg" >&2; exit 1; fi
          mkdir -p dist
          cp "$dmg" "dist/efto-$v-macos-arm64.dmg"
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dist

  # 统一发布，避免两个 job 并发创建同一个 Release 撞 422。
  publish:
    needs: [windows-x64, macos-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          v="$(python3 -c 'import json;print(json.load(open("crates/app/tauri.conf.json"))["version"])')"
          echo "v=$v" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: efto v${{ steps.ver.outputs.v }}
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/plugins/*.zip
            dist/*.exe
            dist/*.dmg
