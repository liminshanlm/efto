# Cargo 项目级配置。
#
# rusty_v8 的预编译静态库由 scripts/bootstrap.ps1 下载到 vendor/rusty_v8/（该目录不入库），
# 这里固定指向那份本地副本，构建时直接复用，无需联网。
# 换机器时两种选择：
#   1. 跑一次 scripts/bootstrap.ps1（可直连 GitHub 时它会自己下；否则先用镜像下载：
#        curl -L -o vendor/rusty_v8/rusty_v8_release_x86_64-pc-windows-msvc.lib.gz \
#        "https://gh-proxy.com/https://github.com/denoland/rusty_v8/releases/download/v152.2.0/rusty_v8_release_x86_64-pc-windows-msvc.lib.gz"）
#   2. 改 RUSTY_V8_ARCHIVE 为任意本地路径，或设 RUSTY_V8_MIRROR 模板（build.rs 支持 {tag}/{file} 占位符）。
[env]
RUSTY_V8_ARCHIVE = { value = "vendor/rusty_v8/rusty_v8_release_x86_64-pc-windows-msvc.lib.gz", relative = true }
RUSTY_V8_ARCHIVE_SHA256 = "0b17ca072bae37dd4ff00e6014d2b413becb031c9342ee11cb8226a5881f62b2"

[alias]
# 常用快捷命令（都需在 MSVC 开发环境里跑，见 scripts/vsenv.ps1）
ck = ["check", "--workspace"]
t = ["test", "--workspace"]
b = ["build", "--release"]
